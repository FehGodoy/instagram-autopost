name: Postar no Instagram

on:
  schedule:
    - cron: "17 * * * *"  # a cada hora, no minuto 17 (evita o congestionamento da hora cheia)
  workflow_dispatch:       # botão para rodar manualmente

permissions:
  contents: write

jobs:
  postar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Postar próximo vídeo
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          VIDEO_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/videos/
        run: python postar.py

      - name: Salvar registro do que foi postado
        run: |
          git config user.name "autopost-bot"
          git config user.email "actions@users.noreply.github.com"
          git add postados.txt || true
          git diff --cached --quiet || git commit -m "registro: vídeo postado"
          git push
